name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Initialize Capacitor iOS Platform
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Build Xcode Project (Unsigned / Simulator Build)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS Simulator' -archivePath build/App.xcarchive archive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Create IPA
  run: |
    mkdir -p Payload
    cp -R ios/App/build/App.xcarchive/Products/Applications/App.app Payload/
    zip -r AnkiSync.ipa Payload

- name: Upload IPA
  uses: actions/upload-artifact@v4
  with:
    name: AnkiSync-IPA
    path: AnkiSync.ipa
